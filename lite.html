<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Market Rush Lite</title>
  <link rel="icon" href="data:," />
  <style>
    :root { --taxi: #ffc21a; --ink: #1b1208; --cream: #f6e7cd; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9b98c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; align-items: center; gap: 10px; color: var(--cream); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    #hud b { color: var(--taxi); }
    #hud .fps { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; }
    #stick { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(27,18,8,.22); border: 2px solid rgba(246,231,205,.45); touch-action: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--taxi); box-shadow: 0 3px 10px rgba(0,0,0,.35); }
    #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #f1c78e, #b9814f); color: var(--ink); text-align: center; padding: 24px; }
    #start h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.02em; }
    #start p { margin: 0 0 18px; font-size: 14px; opacity: .75; }
    #start button { font: inherit; font-weight: 700; font-size: 16px; padding: 14px 28px; border: 0; border-radius: 999px; background: var(--ink); color: var(--taxi); }
    #start.gone { display: none; }
  </style>
</head>
<body>
  <div id="hud"><span><b>MR</b> Market Rush Lite</span><span class="fps" id="fps">--</span></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="start"><div><h1>Market Rush Lite</h1><p>Drag the yellow knob to drive the market.</p><button id="go">Start</button></div></div>
  <script type="module" src="./js/lite.js"></script>
</body>
</html>
